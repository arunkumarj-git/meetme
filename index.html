<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arun Kumar J | Linux Production Support</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05080d;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            width: 100%;
            height: 70px;
            background: #050b11;
            border-bottom: 1px solid rgba(0, 229, 255, 0.12);

            display: flex;
            align-items: center;
            padding: 0 35px;
        }

        /* BRAND */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* TUX LOGO */

        .tux-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;

            filter:
                drop-shadow(0 0 5px rgba(255, 193, 7, 0.25))
                drop-shadow(0 0 10px rgba(255, 193, 7, 0.12));

            transition: 0.3s ease;
        }

        .brand:hover .tux-logo {
            transform: scale(1.08);
            filter:
                drop-shadow(0 0 7px rgba(255, 193, 7, 0.45))
                drop-shadow(0 0 15px rgba(255, 193, 7, 0.2));
        }

        /* NAME */

        .brand-name {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .brand-name span {
            color: #00e5d4;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            .navbar {
                height: 64px;
                padding: 0 18px;
            }

            .tux-logo {
                width: 43px;
                height: 43px;
            }

            .brand-name {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <a href="#" class="brand">

            <!-- YOUR TUX LINUX IMAGE -->
            <img
                src="assets/img/tux.png"
                alt="Linux"
                class="tux-logo"
            >

            <!-- NAME ONLY -->
            <div class="brand-name">
                Arun <span>Kumar J</span>
            </div>

        </a>

    </nav>

</body>
</html>
